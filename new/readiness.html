<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Istanbul SDI - Full Color Control</title>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #f0f2f5; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .dashboard {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 12px; 
            width: 350px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
        }

        h3 { margin: 0 0 10px 0; font-size: 1.1rem; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        h4 { margin: 15px 0 5px 0; font-size: 0.75rem; text-transform: uppercase; color: #777; letter-spacing: 0.5px; }

        .category-box { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        
        .layer-item { 
            display: flex; align-items: center; padding: 4px 0;
        }
        .layer-item input { margin-right: 10px; width: 16px; height: 16px; cursor: pointer; }
        .layer-item label { cursor: pointer; font-size: 0.85rem; color: #333; flex-grow: 1; }

        .color-dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="dashboard" id="ui-container">
        <h3>Istanbul Data Control</h3>
    </div>

    <div id="map"></div>

    <script>
        // 1. CONFIGURATIE: Elke laag heeft nu een kleur en bijbehorende IDs
        const MAP_CONFIG = [
            {
                category: "🚨 Kritieke Infrastructuur",
                layers: [
                    { id: 'grp-bridges', label: 'Bruggen & Viaducten', color: '#e74c3c', checked: true, layerIds: ['roads_bridges_major', 'roads_bridges_link', 'roads_bridges_other', 'roads_bridges_major_casing', 'roads_bridges_link_casing', 'roads_bridges_other_casing'] },
                    { id: 'grp-tunnels', label: 'Tunnels & Onderdoorgangen', color: '#3498db', checked: true, layerIds: ['roads_tunnels_major', 'roads_tunnels_link', 'roads_tunnels_minor', 'roads_tunnels_other', 'roads_tunnels_major_casing', 'roads_tunnels_link_casing', 'roads_tunnels_minor_casing', 'roads_tunnels_other_casing'] },
                    { id: 'grp-piers', label: 'Havens & Piers', color: '#1abc9c', checked: false, layerIds: ['roads_pier'] },
                    { id: 'grp-rail', label: 'Spoorwegen', color: '#9b59b6', checked: false, layerIds: ['roads_rail'] }
                ]
            },
            {
                category: "🏥 Maatschappelijk",
                layers: [
                    { id: 'grp-hospitals', label: 'Ziekenhuizen', color: '#f1c40f', checked: false, layerIds: ['landuse_hospital'] },
                    { id: 'grp-schools', label: 'Onderwijs', color: '#e67e22', checked: false, layerIds: ['landuse_school'] }
                ]
            },
            {
                category: "🗺️ Basis Kaart",
                layers: [
                    { id: 'grp-roads-major', label: 'Hoofdwegen (E80/D100)', color: '#444444', checked: true, layerIds: ['roads_major', 'roads_major_casing_late', 'roads_link', 'roads_link_casing'] },
                    { id: 'grp-roads-minor', label: 'Binnenwegen', color: '#95a5a6', checked: false, layerIds: ['roads_minor', 'roads_minor_service', 'roads_other'] },
                    { id: 'grp-buildings', label: 'Gebouwen', color: '#bdc3c7', checked: true, layerIds: ['buildings'] },
                    { id: 'grp-water', label: 'Waterlichamen', color: '#a2d9ff', checked: true, layerIds: ['water'] },
                    { id: 'grp-green', label: 'Parken & Groen', color: '#2ecc71', checked: false, layerIds: ['landuse_urban_green', 'landuse_park'] }
                ]
            }
        ];

        const API_KEY = "d42e766a567023ee";
        const STYLE_URL = `https://api.protomaps.com/styles/v5/light/en.json?key=${API_KEY}`;

        const map = new maplibregl.Map({
            container: 'map',
            style: STYLE_URL,
            center: [28.9784, 41.0082], 
            zoom: 12,
            hash: true
        });

        // 2. UI Bouwen
        function initDashboard() {
            const container = document.getElementById('ui-container');

            MAP_CONFIG.forEach(section => {
                const box = document.createElement('div');
                box.className = 'category-box';
                box.innerHTML = `<h4>${section.category}</h4>`;

                section.layers.forEach(layer => {
                    const item = document.createElement('div');
                    item.className = 'layer-item';
                    item.innerHTML = `
                        <input type="checkbox" id="${layer.id}" ${layer.checked ? 'checked' : ''}>
                        <div class="color-dot" style="background: ${layer.color};"></div>
                        <label for="${layer.id}">${layer.label}</label>
                    `;

                    item.querySelector('input').addEventListener('change', () => applyLayerState(layer));
                    box.appendChild(item);
                });
                container.appendChild(box);
            });
        }

        // 3. Kaart updaten op basis van type (Line of Fill)
        function applyLayerState(layerCfg) {
            const isVisible = document.getElementById(layerCfg.id).checked;
            
            layerCfg.layerIds.forEach(id => {
                if (map.getLayer(id)) {
                    map.setLayoutProperty(id, 'visibility', isVisible ? 'visible' : 'none');
                    
                    if (isVisible) {
                        const type = map.getLayer(id).type;
                        
                        // Kleur toepassen op basis van het type laag
                        if (type === 'line') {
                            map.setPaintProperty(id, 'line-color', layerCfg.color);
                            if (!id.includes('casing')) map.setPaintProperty(id, 'line-width', 2.5);
                        } 
                        else if (type === 'fill') {
                            map.setPaintProperty(id, 'fill-color', layerCfg.color);
                            map.setPaintProperty(id, 'fill-opacity', 0.7);
                        }
                    }
                }
            });
        }

        map.on('load', () => {
            initDashboard();
            MAP_CONFIG.forEach(section => {
                section.layers.forEach(layer => applyLayerState(layer));
            });
        });

        map.addControl(new maplibregl.NavigationControl());
    </script>
</body>
</html>
